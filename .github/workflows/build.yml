name: Build TapCopy APK

# Builds an installable debug APK on every push, publishes it as a downloadable
# GitHub Release, and lets you trigger a build by hand.
on:
  push:
    branches: [ main, master, claude/phone-installation-product-ys4gsc ]
  workflow_dispatch:

# Needed so the workflow can create/update the Release that hosts the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the debug APKs
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename the APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TapCopy.apk
          cp downloader/build/outputs/apk/debug/downloader-debug.apk TapSave.apk

      - name: Upload the APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TapCopy-apks
          path: |
            TapCopy.apk
            TapSave.apk
          if-no-files-found: error

      - name: Publish the APKs to a downloadable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recreate a rolling "latest" release so the download links stay stable.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest TapCopy.apk TapSave.apk \
            --title "TapCopy + TapSave (latest build)" \
            --notes "**TapCopy.apk** — copy on-screen text. **TapSave.apk** — video downloader (needs the yt-dlp backend in /server). Install on Android 11+, allow installing from this source."
