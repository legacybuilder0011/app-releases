name: Build TapCopy APK

# Builds an installable debug APK on every push, publishes it as a downloadable
# GitHub Release, and lets you trigger a build by hand.
on:
  push:
    branches: [ main, master, claude/phone-installation-product-ys4gsc ]
  workflow_dispatch:

# Needed so the workflow can create/update the Release that hosts the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TapCopy.apk

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapCopy-debug-apk
          path: TapCopy.apk
          if-no-files-found: error

      - name: Publish the APK to a downloadable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recreate a rolling "latest" release so the download link stays stable.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest TapCopy.apk \
            --title "TapCopy (latest build)" \
            --notes "Install this APK on your Android 11+ phone. Download **TapCopy.apk**, open it on your phone, allow installing from this source, then open TapCopy and enable the accessibility service."
